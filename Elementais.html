<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">

<style>
:root{--ink:#fff;--fire:#ff7a2f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:#8fc7ee;color:var(--ink);font-family:system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
body{position:relative}
#c{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;padding:10px 14px;font-weight:700;font-size:18px;text-shadow:0 2px 0 #0006;pointer-events:none}
.bar{width:150px;height:18px;background:#0009;border:2px solid #000a;border-radius:5px;position:relative;margin-bottom:5px;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:#e0453a;transition:width .15s}.bar.m i{background:#3a8dff}
.bar span{position:absolute;inset:0;text-align:center;font-size:12px;line-height:18px}
#sc{text-align:right;line-height:1.35}
.em{width:44px;height:44px;border-radius:50%;border:0;font-size:24px;background:#000a}
#bag{position:absolute;left:10px;top:104px;min-width:46px;padding:0 8px;height:46px;border-radius:10px;border:0;background:#000a;font-size:24px;display:none}
#inv{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;background:#0b1020ee;padding:16px;overflow:auto;touch-action:pan-y}

.grid{display:grid;grid-template-columns:repeat(3,92px);gap:10px}
.slot{background:#1d2740;border:2px solid #3a4670;border-radius:10px;height:92px;display:flex;flex-direction:column;align-items:center;justify-content:center;font:inherit;font-size:12px;text-align:center;padding:4px;color:#fff}
.slot.on{border-color:#e0a030;box-shadow:0 0 10px #e0a03099}.slot.lock{opacity:.35}
.slot i{width:34px;height:34px;border-radius:6px;display:block;margin-bottom:4px;font-style:normal;font-size:26px;line-height:34px}
#emo{position:absolute;right:22px;bottom:140px;display:flex;gap:8px}
#chest{position:absolute;left:50%;transform:translateX(-50%);bottom:130px;display:none;font:inherit;font-weight:700;font-size:18px;padding:10px 18px;border:0;border-radius:8px;background:#e0a030;color:#2a1a06;box-shadow:0 4px 0 #0006}
.bar.x i{background:#e0b030}

.at>i{font-style:normal;font-size:26px}.at>div{flex:1;font-size:13px;line-height:1.3}.at b{font-size:15px}
.at button{width:44px;height:44px;border:0;border-radius:8px;font:inherit;font-weight:700;font-size:26px;background:#e0a030;color:#2a1a06}.at button:disabled{opacity:.3}
input{user-select:text;-webkit-user-select:text;touch-action:auto}

#clock{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:#000a;border:2px solid #000a;border-radius:10px;padding:3px 12px;text-align:center;font-weight:700;pointer-events:none;text-shadow:0 2px 0 #0006;line-height:1.15;min-width:78px}
#clock b{display:block;font-size:20px;letter-spacing:1px}#clock small{font-size:11px;opacity:.85}#clock.n{background:#10183acc;border-color:#6a7fd0}
#talk{position:absolute;left:50%;transform:translateX(-50%);bottom:130px;display:none;font:inherit;font-weight:700;font-size:18px;padding:10px 18px;border:0;border-radius:8px;background:#4fb3ff;color:#06223a;box-shadow:0 4px 0 #0006}
@media(max-width:480px){.bar{width:116px}}
#toast{position:absolute;top:30%;left:50%;transform:translateX(-50%);background:#000b;padding:8px 14px;border-radius:8px;font-weight:700;display:none;pointer-events:none;white-space:nowrap}
#sw{position:absolute;left:10px;bottom:64px;display:none;font:inherit;font-weight:700;padding:8px 12px;border:0;border-radius:6px;background:#a46bff;color:#fff;box-shadow:0 3px 0 #0005}
#bar{position:absolute;left:10px;bottom:10px;display:flex;gap:6px;pointer-events:none}
.sk{width:44px;height:44px;border-radius:6px;background:#2b2f3acc;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:18px;opacity:.75}
.sk small{font-size:9px}
.sk.on{background:#5a2a12;outline:2px solid var(--fire);opacity:1}
#fire{position:absolute;right:22px;bottom:34px;width:96px;height:96px;border-radius:50%;border:0;background:var(--fire);font-size:42px;box-shadow:0 5px 0 #a8430f;touch-action:none}
#fire:active{transform:translateY(3px);box-shadow:0 2px 0 #a8430f}
#msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:#10182a66;text-shadow:0 2px 4px #000b;padding:24px;font-size:17px;line-height:1.4}
#msg h1{font-size:32px;margin:0 0 8px}
#cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px;width:100%;max-width:340px}
.card{font:inherit;color:#fff;background:#1d2740;border:3px solid var(--c);border-radius:10px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 4px 0 #0006}
.card span{font-size:38px}.card b{font-size:18px}.card small{font-size:12px;opacity:.85;line-height:1.25}
.card:active{transform:translateY(3px);box-shadow:none}
#fire{box-shadow:0 5px 0 #0004!important}#fire:active{box-shadow:0 2px 0 #0004!important}
</style></head>

{const tg=new THREE.BoxGeometry(.7,2.6,.7),lg=new THREE.BoxGeometry(3,1.6,3),lg2=new THREE.BoxGeometry(2,1.4,2),

addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(e.code==='Space')firing=true;if(e.key.toLowerCase()==='e'&&!e.repeat)talk()});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=0;if(e.code==='Space')firing=false});

function wsUrl(){let u=SERVER_URL||'';if(!u){try{u=localStorage.getItem('srv')||''}catch(e){}}
 if(!u&&/^https?:$/.test(location.protocol))return(location.protocol==='https:'?'wss://':'ws://')+location.host;
 u=u.trim().replace(/\/+$/,'');if(!u)return'';if(!/^(https?|wss?):\/\//.test(u))u='https://'+u;
 return u.replace(/^http/,'ws')}
const NET={on:false,ws:null,id:null,name:'',others:new Map(),zs:new Map(),ping:0,off:null,opened:false,err:'',iv:0,pv:0};
// ANTILAG: o jogador manda a posição 10x/s, o servidor devolve tudo 10x/s e o cliente
// desenha os outros jogadores/zumbis 0,15 s "no passado", interpolando entre os pacotes (sem tremedeira).
const INTERP=.15,vis=[];
const nowS=()=>performance.now()/1000;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function apInfo(){return{sh:WR.shirt,pn:WR.pants,ht:WR.hat}}
function elKey(){for(const k in EL)if(EL[k]===E)return k;return'fire'}
function cleanName(s){return String(s||'').replace(/[^\p{L}\p{N} _\-]/gu,'').replace(/\s+/g,' ').trim().slice(0,14)}
function angLerp(a,b,k){if(a===undefined||b===undefined)return b||0;return a+(((b-a+Math.PI*3)%(Math.PI*2))-Math.PI)*k}
function sampleBuf(b,rt){const n=b.length;if(!n)return null;const L=b[n-1];
 if(rt>=L.t){if(n<2)return L;const Q=b[n-2],d=(L.t-Q.t)||.1,ex=Math.min(rt-L.t,.25);return{x:L.x+(L.x-Q.x)/d*ex,z:L.z+(L.z-Q.z)/d*ex,f:L.f}}
 if(rt<=b[0].t)return b[0];
 for(let i=n-1;i>0;i--){const A=b[i-1],B=b[i];if(rt>=A.t){const k=(rt-A.t)/((B.t-A.t)||1);return{x:A.x+(B.x-A.x)*k,z:A.z+(B.z-A.z)*k,f:angLerp(A.f,B.f,k)}}}
 return b[0]}

// ---- conexão ----
function netConnect(name,done,fail){
 let ws,got=false;NET.err='';NET.opened=false;
 const url=wsUrl();if(!url){fail('Informe o endereço do servidor (o link do Render) abaixo.');return}
 try{ws=new WebSocket(url)}catch(e){fail('Endereço do servidor inválido.');return}
 NET.ws=ws;
 const to=setTimeout(()=>{if(!got){NET.err=NET.err||'O servidor demorou para responder. Tente de novo.';try{ws.close()}catch(e){}}},70000);
 ws.onopen=()=>{NET.opened=true;ws.send(JSON.stringify({t:'join',name,ap:apInfo()}))};
 ws.onmessage=ev=>{let m;try{m=JSON.parse(ev.data)}catch(e){return}
  if(m.t==='w'&&!got){got=true;clearTimeout(to);netWelcome(m);done()}else netMsg(m)};
 ws.onclose=()=>{clearTimeout(to);if(!got)fail(NET.err||(NET.opened?'O servidor recusou a conexão.':'Não foi possível conectar ao servidor.'));else netLost()};
 ws.onerror=()=>{}}
function netWelcome(m){NET.on=true;NET.id=m.id;NET.name=m.name;NET.off=null;NET.others.clear();NET.zs.clear();
 for(const p of m.ps)addRemote(p);syncClock(m.c,m.d,true);
 clearInterval(NET.iv);clearInterval(NET.pv);
 NET.iv=setInterval(netTick,100);                                   // posição + estado a cada 0,1 s
 NET.pv=setInterval(()=>netSend({t:'ping',ts:performance.now()}),2000)}
function netTick(){netSend({t:'s',x:+P.x.toFixed(2),z:+P.z.toFixed(2),f:+(P.face||0).toFixed(2),a:running?1:0,w:P.sw?1:0})}
function netLost(){NET.on=false;clearInterval(NET.iv);clearInterval(NET.pv);running=false;paused=true;
 for(const o of NET.others.values())S.remove(o.g);NET.others.clear();enemies.forEach(e=>S.remove(e.m));enemies=[];NET.zs.clear();
 const m=document.getElementById('msg');m.innerHTML='<h1>Desconectado</h1><div>A conexão com o servidor caiu.</div><div style="margin-top:14px;width:min(260px,80vw)"><button id="rc" class="card" style="--c:#4fb3ff;width:100%"><span>🔄</span><b>Reconectar</b></button></div>';
 m.style.display='flex';document.getElementById('rc').onclick=()=>location.reload()}
function netMsg(m){switch(m.t){
 case 'n':netSnap(m);break;
 case 'act':remoteAct(m);break;
 case 'zk':netKill(m);break;
 case 'hu':if(running&&P.inv<=0&&P.hp>0){P.hp-=m.d;P.inv=1;emote('pain',.9);burst(P.x,1.5,P.z,12,0xffffff,5)}break;
 case 'pj':if(addRemote(m.p))toast('➡️ '+m.p.name+' entrou',1800);break;
 case 'pl':{const o=NET.others.get(m.id);if(o){S.remove(o.g);NET.others.delete(m.id);toast('⬅️ '+o.name+' saiu',1800)}break}
 case 'pc':{const o=NET.others.get(m.p.id);if(o){o.a=m.p.a;if(m.p.sp){o.buf.length=0;o.init=false}setRemoteLook(o,m.p)}break}
 case 'pong':NET.ping=Math.round(performance.now()-m.ts);break;
 case 'x':NET.err=m.m;break}}
function syncClock(c,d,hard){let df=c-tClock;if(df>CYC/2)df-=CYC;else if(df<-CYC/2)df+=CYC;
 if(hard||Math.abs(df)>2)tClock=c;else tClock+=df*.2;if(tClock<0)tClock+=CYC;if(tClock>=CYC)tClock-=CYC;dayN=d}

// ---- snapshot do servidor (10x/s): jogadores + zumbis ----
function netSnap(m){const t=nowS(),est=t-m.ts;
 if(NET.off===null||est<NET.off)NET.off=est;else NET.off+=(est-NET.off)*.02;   // tempo do servidor -> tempo local
 const ct=m.ts+NET.off;
 syncClock(m.c,m.d);
 for(const a of m.p){if(a[0]===NET.id)continue;const o=NET.others.get(a[0]);if(!o)continue;
  o.buf.push({t:ct,x:a[1],z:a[2],f:a[3]});if(o.buf.length>12)o.buf.shift();o.a=a[4];o.swim=a[5]}
 if(!running)return;
 const seen=new Set();
 for(const a of m.z){seen.add(a[0]);let e=NET.zs.get(a[0]);
  if(!e){e=makeZ(a[0],a[1],a[2],a[3],ct);NET.zs.set(a[0],e);enemies.push(e)}
  else if(a[3]<e.hp-.01){e.pop=.1;burst(e.x,1.5,e.z,6,0xb6e08a,5)}
  e.hp=a[3];e.buf.push({t:ct,x:a[1],z:a[2]});if(e.buf.length>12)e.buf.shift()}
 for(const [id,e] of NET.zs)if(!seen.has(id)){NET.zs.delete(id);burst(e.x,1.5,e.z,14,0x9fe08a,6);S.remove(e.m);e.hp=-1}}
function makeZ(id,x,z,hp,ct){const m=makeR6(0x6fae5a,0x8a3030,0x4a4a55);m.armL.rotation.x=m.armR.rotation.x=-1.5;m.position.set(x,0,z);S.add(m);
 return{m,x,z,hp,sp:1,pop:0,zb:true,net:true,id,rot:0,buf:[{t:ct,x,z}]}}
// dano: no online o cliente avisa o servidor (ele é quem diminui a vida do zumbi)
function hurt(e,d){if(e.net)netSend({t:'hit',id:e.id,d:Math.round(d*100)/100});else e.hp-=d}
// recompensa de abate (todos que bateram no zumbi ganham juntos)
function reward(){score++;if(cls==='mage'){mxp++;const nl=Math.min(10,Math.floor(mxp/3));if(nl>mlv){mlv=nl;applyStats()}}gainXp()}
function netKill(m){const e=NET.zs.get(m.id);
 if(e){NET.zs.delete(m.id);burst(e.x,1.5,e.z,18,E.spark,7);S.remove(e.m);e.hp=-1}else burst(m.x,1.5,m.z,18,E.spark,7);
 if(running&&m.by.includes(NET.id)){
  if(m.by.length>1){const n=m.by.filter(i=>i!==NET.id).map(i=>(NET.others.get(i)||{}).name).filter(Boolean);if(n.length)toast('🤝 Abate dividido com '+n.join(', '),1800)}
  reward()}}

function mkLabel(txt){const c=document.createElement('canvas');c.width=256;c.height=64;const x=c.getContext('2d');
 x.font='bold 30px system-ui,sans-serif';x.textAlign='center';x.textBaseline='middle';
 const w=Math.min(250,x.measureText(txt).width+28);x.fillStyle='rgba(0,0,0,.55)';x.beginPath();
 if(x.roundRect)x.roundRect(128-w/2,8,w,48,14);else x.rect(128-w/2,8,w,48);x.fill();

function addRemote(p){if(p.id===NET.id||NET.others.has(p.id))return null;
 const g=makeR6(0xd9a77c,0x6e6252,0x453b30);g.visible=false;S.add(g);
 const o={id:p.id,name:p.name,g,buf:[],x:0,z:0,f:0,a:p.a||0,swim:0,swing:0,shoot:0,mv:0,init:false,cls:'',hatG:new THREE.Group(),label:null,sw3:sword.clone(),bw3:bow.clone()};
 g.add(o.hatG);g.armR.add(o.sw3);g.armL.add(o.bw3);NET.others.set(p.id,o);setRemoteLook(o,p);return o}
function setRemoteLook(o,p){o.cls=p.cls||'';o.sw3.visible=o.cls==='war';o.bw3.visible=o.cls==='arc';
 const f=id=>CLO.find(c=>c.id===id),ap=p.ap||{},sh=f(ap.sh)||CLO[0],pn=f(ap.pn)||CLO[5],ht=f(ap.ht)||CLO[9];
 o.g.children[0].material.color.setHex(sh.col);o.g.legL.children[0].material.color.setHex(pn.col);o.g.legR.children[0].material.color.setHex(pn.col);
 while(o.hatG.children.length)o.hatG.remove(o.hatG.children[0]);
 const mt=new THREE.MeshLambertMaterial({color:ht.col}),hb=(W,H,D,x,y,z)=>{const q=new THREE.Mesh(new THREE.BoxGeometry(W*U,H*U,D*U),mt);q.position.set(x*U,y*U,z*U);o.hatG.add(q)};
 if(ht.id==='h0'){hb(1.3,.25,1.3,0,5.05,0);hb(.9,.4,.9,0,5.3,0)}else if(ht.id==='h1'){hb(1.1,.4,1.1,0,5.2,0);hb(1,.1,.6,0,5.05,.7)}else{hb(1.5,.15,1.5,0,5.05,0);hb(.95,1,.95,0,5.6,0)}
 const ic=o.cls==='war'?'⚔️':o.cls==='arc'?'🏹':o.cls==='mage'?(EL[p.el]?EL[p.el].icon:'🔮'):'';
 if(o.label)o.g.remove(o.label);o.label=mkLabel((ic?ic+' ':'')+o.name);o.g.add(o.label)}
function remotesUpdate(dt){const rt=nowS()-INTERP,T=nowS();
 for(const o of NET.others.values()){const q=sampleBuf(o.buf,rt),g=o.g;g.visible=!!(o.a&&q);if(!q)continue;
  if(!o.init){o.f=q.f;o.x=q.x;o.z=q.z;o.init=true}
  o.mv=Math.hypot(q.x-o.x,q.z-o.z)/Math.max(dt,.001);o.x=q.x;o.z=q.z;o.f=angLerp(o.f,q.f,Math.min(1,dt*14));
  g.position.set(o.x,o.swim?-.95:0,o.z);g.rotation.y=o.f;g.rotation.x+=((o.swim?1.15:0)-g.rotation.x)*Math.min(1,dt*10);
  const s=Math.sin(T*10)*.8*(o.mv>.8?1:0);g.legL.rotation.x=s;g.legR.rotation.x=-s;g.armL.rotation.x=-s;g.armR.rotation.x=s;
  o.shoot-=dt;o.swing-=dt;
  if(o.cls==='war'){const p=o.swing>0?1-o.swing/.3:1;g.armR.rotation.x=o.swing>0?-2.8+2.2*p:-.5}
  else if(o.cls==='arc'){g.armL.rotation.set(o.shoot>0?-Math.PI/2:-1,0,0);g.armR.rotation.set(o.shoot>0?-1.4:-.3,o.shoot>.17?.9:0,0)}
  else if(o.shoot>0)g.armR.rotation.x=-Math.PI/2;
  if(o.swim){const s3=Math.sin(T*8);g.armL.rotation.x=-2.6+s3*1.1;g.armR.rotation.x=-2.6-s3*1.1;g.legL.rotation.x=Math.sin(T*16)*.45;g.legR.rotation.x=-Math.sin(T*16)*.45}}}

function makeArrow(a){const g=new THREE.Group(),hd=new THREE.Mesh(new THREE.BoxGeometry(.16,.1,.25),new THREE.MeshBasicMaterial({color:0x888888}));hd.position.z=.62;
 g.add(new THREE.Mesh(new THREE.BoxGeometry(.06,.06,1.1),new THREE.MeshBasicMaterial({color:0xd9b27c})),hd);g.rotation.y=a;return g}

 if(t==='arrow')netSend({t:'act',k:'arrow',x:P.x,z:P.z,a,s:E.speed*(1+AT.arrow*.07),l:E.life});

 if(m.k==='bolt'){const X=EL[m.el]||EL.fire,g=makeBolt(m.a,X);g.position.set(m.x,1.9,m.z);S.add(g);vis.push({m:g,vx:Math.sin(m.a)*X.speed,vz:Math.cos(m.a)*X.speed,life:X.life,col:X.trail});burst(m.x,1.9,m.z,3,X.spark,3);o.shoot=.25}
 else if(m.k==='arrow'){const g=makeArrow(m.a);g.position.set(m.x+Math.sin(m.a)*1.1,1.6,m.z+Math.cos(m.a)*1.1);S.add(g);vis.push({m:g,vx:Math.sin(m.a)*m.s,vz:Math.cos(m.a)*m.s,life:m.l,col:0xd9b27c});o.shoot=.35}
 else if(m.k==='slash'){o.swing=.3;for(let i=0;i<9;i++){const a=m.a-1.2+i*.3;burst(o.x+Math.sin(a)*2.6,1.4,o.z+Math.cos(a)*2.6,2,0xffe2a8,2)}}
 else if(m.k==='wave'){const r=new THREE.Mesh(new THREE.TorusGeometry(1,.06,6,36),new THREE.MeshBasicMaterial({color:EL.water.core,transparent:true}));r.rotation.x=Math.PI/2;r.position.set(m.x,.4,m.z);r.scale.set(.1,.1,1);S.add(r);vis.push({ring:true,m:r,r:.1,max:6.5,life:1});burst(m.x,1,m.z,10,EL.water.spark,4);o.shoot=.3}
 else if(m.k==='dash'){for(let i=0;i<8;i++)burst(m.x+Math.sin(m.a)*i*.7,1,m.z+Math.cos(m.a)*i*.7,2,EL.wind.trail,2);o.shoot=.2}
 else if(m.k==='spike'){const tele=new THREE.Mesh(new THREE.CircleGeometry(2.2,24),new THREE.MeshBasicMaterial({color:0x8a6240,transparent:true,opacity:.45}));tele.rotation.x=-Math.PI/2;tele.position.set(m.x,.06,m.z);S.add(tele);vis.push({spike:true,x:m.x,z:m.z,t:.4,up:false,tele,m:null,life:1});o.shoot=.3}}
function visUpdate(dt){
 for(const v of vis){
  if(v.ring){v.r+=14*dt;v.m.scale.set(v.r,v.r,1);v.m.material.opacity=Math.max(0,1-v.r/v.max);if(v.r>=v.max)v.life=0}
  else if(v.spike){v.t-=dt;
   if(!v.up){if(v.t<=0){v.up=true;v.t=.6;S.remove(v.tele);v.tele=null;
     const g=new THREE.Group();for(let i=0;i<5;i++){const h=i?1.2+Math.random()*1.2:3,s=i?.6:1.1,sp=new THREE.Mesh(new THREE.BoxGeometry(s,h,s),new THREE.MeshLambertMaterial({color:i?0x7d6a55:0x6b5a48})),a=i*1.57,r=i?1.2:0;sp.position.set(Math.sin(a)*r,h/2,Math.cos(a)*r);sp.rotation.y=Math.random();g.add(sp)}
     g.position.set(v.x,0,v.z);g.scale.y=.01;S.add(g);v.m=g;burst(v.x,.3,v.z,16,EL.earth.spark,6)}}
   else{v.m.scale.y=Math.max(.01,Math.min(1,(.6-v.t)*10,v.t/.15));if(v.t<=0)v.life=0}}
  else{v.m.position.x+=v.vx*dt;v.m.position.z+=v.vz*dt;v.life-=dt;if(Math.random()<.5)burst(v.m.position.x,v.m.position.y,v.m.position.z,1,v.col,1)}}
 for(let i=vis.length-1;i>=0;i--){const v=vis[i];if(v.life<=0){S.remove(v.m);S.remove(v.tele);vis.splice(i,1)}}}

function needXp(){return 2+plv}

  while(plv<MAXLV&&pxp>=needXp()){pxp-=needXp();plv++;AT.pts++;up++}
  if(up){toast('⭐ Nível '+plv+'! +'+up+' ponto de atributo (abra a 🎒)',3200);burst(P.x,2,P.z,24,0xffe066,7);emote('happy',1.2)}}

  h+=L.map(a=>'<div class="at"><i>'+a[1]+'</i><div><b>'+a[2]+'</b> '+AT[a[0]]+'/'+AT_MAX+'<br><span style="opacity:.8">'+a[3]+'</span></div><button data-a="'+a[0]+'"'+(AT.pts<=0||AT[a[0]]>=AT_MAX?' disabled':'')+'>+</button></div>').join('');

  cam.position.copy(tg2).addScaledVector(dir,camD);cam.position.y=Math.max(.35,cam.position.y);cam.lookAt(tg2);
  
  document.getElementById('hpf').style.width=Math.max(0,P.hp)/P.maxhp*100+'%';document.getElementById('hpt').textContent='❤ '+Math.max(0,P.hp)*20+'/'+P.maxhp*20;
  document.getElementById('xpf').style.width=(plv>=MAXLV?100:pxp/needXp()*100)+'%';document.getElementById('xpt').textContent='⭐ Nv '+plv+(plv>=MAXLV?' MAX':' · '+pxp+'/'+needXp());
  document.getElementById('mpf').style.width=Math.min(100,P.mana||0)+'%';document.getElementById('mpt').textContent='⚡ '+Math.floor(P.mana||0)+'/100';
  document.getElementById('sc').innerHTML='💴 ¥ '+reais+'<br>Abates: '+score+(running&&cls==='mage'?'<br>Elem. Nv '+mlv+' · '+(P.ammo>0?E.icon+' '+P.ammo+'/'+E.max:'recarga '+Math.ceil(P.rt)+'s')+(relic?'<br>🔮 relíquia pronta':relicM?'<br>🔮 relíquia: '+Math.round(Math.hypot(P.x-relicM.x,P.z-relicM.z))+'m':''):'');
  document.getElementById('sw').style.display=running&&cls==='mage'&&relic&&!paused?'block':'none';
  fb.style.opacity=running&&P.ammo<=0?.4:1;
  if(NET.on){remotesUpdate(dt);visUpdate(dt)}
  R.render(S,cam);
}
function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;if(running&&(!paused||NET.on))update(dt);render(dt);requestAnimationFrame(loop)}
showName();
requestAnimationFrame(loop);
</script>
